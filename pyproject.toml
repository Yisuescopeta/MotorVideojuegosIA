[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengame"
dynamic = ["version"]
description = "Motor de videojuegos 2D IA-first en Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "raylib-py>=5.0.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "CairoSVG>=2.7.1",
    "idna>=3.15",
    "mypy>=1.12.0",
    "Pillow>=12.2.0",
    "pip-audit>=2.7.3",
    "resvg-py>=0.3.2",
    "ruff>=0.7.1",
    "urllib3>=2.7.0",
]

[tool.setuptools.dynamic]
version = {attr = "engine.config.ENGINE_VERSION"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["engine*", "cli*", "tools*", "motor*"]

[tool.setuptools.package-data]
"engine.editor.resources.icons" = [
    "*.json",
    "*.png",
    "vendor/lucide/LICENSE",
    "vendor/lucide/icons/*.svg",
]
"engine.editor.resources.icons.godot" = [
    "*.json",
    "*.png",
    "svg/*.svg",
]

[project.scripts]
motor = "motor.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".claude",
    ".git",
    ".motor",
    ".pytest_cache",
    "artifacts",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "^tests/",
    "^artifacts/",
    "^build/",
    "^dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "godot",
    ".git",
    ".motor",
    ".pytest_cache",
    "artifacts",
    "build",
    "dist",
]
